# The API only. The Cloudflare Tunnel runs separately on the `tlow` Docker network,
# and its public hostname (<name>-api.<domain>) points at http://api:3000.
# Settings come from .env (copy .env.example).
services:
  api:
    build: .
    container_name: api
    restart: unless-stopped
    env_file: .env
    volumes:
      - tlow-data:/data
    networks:
      - tlow

volumes:
  tlow-data:
    name: tlow-data

networks:
  tlow:
    external: true
